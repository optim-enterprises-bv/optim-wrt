# Build ac-client and aether-sensord against the official OpenWrt SDKs and
# publish the .apk files, so a router owner does not need a buildroot.
#
# Push a tag to cut a release:   git tag pkg-2026.08.28 && git push --tags
# Or run it by hand from the Actions tab to get artifacts without a release.

name: packages

on:
  push:
    tags: ['pkg-*']
  workflow_dispatch:
  pull_request:
    paths: ['net/ac-client/**', 'net/aether-sensord/**', '.github/workflows/packages.yml']

env:
  # Stable release the packages are built against. Packages are ABI-bound to
  # this: a router on 24.10 cannot install these. Bump deliberately.
  OPENWRT_RELEASE: 25.12.5
  GCC: 14.3.0

jobs:
  build:
    name: ${{ matrix.arch }} (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          # ac-client is ~8 MB installed, so only targets with real storage.
          # 8/16 MB-flash mips devices are deliberately absent -- it will not fit.
          - { target: mediatek/filogic,   arch: aarch64_cortex-a53 }
          - { target: qualcommax/ipq807x, arch: aarch64_cortex-a53 }
          - { target: bcm27xx/bcm2711,    arch: aarch64_cortex-a72 }
          - { target: rockchip/armv8,     arch: aarch64_generic }
          - { target: x86/64,             arch: x86_64 }

    steps:
      - uses: actions/checkout@v4
        with: { path: feed }

      - name: Install SDK host dependencies
        run: |
          sudo apt-get update -qq
          # cmake is not optional: aws-lc-sys (via rustls-post-quantum) needs it.
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget zstd cmake

      - name: Fetch OpenWrt SDK
        run: |
          set -euo pipefail
          slug="$(echo '${{ matrix.target }}' | tr / -)"
          tarball="openwrt-sdk-${OPENWRT_RELEASE}-${slug}_gcc-${GCC}_musl.Linux-x86_64.tar.zst"
          url="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${{ matrix.target }}/${tarball}"
          echo "::notice::$url"
          wget -q "$url"
          # Verify against the release's own checksum file before trusting it.
          wget -q -O sums "https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${{ matrix.target }}/sha256sums"
          grep " \*\?${tarball}\$" sums | sha256sum -c -
          mkdir sdk && tar --zstd -xf "$tarball" -C sdk --strip-components=1

      - name: Wire up the optimwrt feed
        working-directory: sdk
        run: |
          set -euo pipefail
          # src-link points at this checkout, so a tag builds exactly its own tree.
          echo "src-link optimwrt $GITHUB_WORKSPACE/feed" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p optimwrt
          # Rust toolchain + deps come from the packages feed.
          ./scripts/feeds install -a

      - name: Configure
        working-directory: sdk
        run: |
          set -euo pipefail
          make defconfig
          echo "CONFIG_PACKAGE_ac-client=m"      >> .config
          echo "CONFIG_PACKAGE_aether-sensord=m" >> .config
          make defconfig
          # Fail loudly rather than silently shipping an empty release.
          grep -q "^CONFIG_PACKAGE_ac-client=m" .config \
            || { echo "::error::ac-client was dropped by defconfig (unsupported arch?)"; exit 1; }

      - name: Build
        working-directory: sdk
        run: |
          set -euo pipefail
          # Rust host toolchain dominates this; single-job on failure for readable logs.
          make package/feeds/optimwrt/ac-client/compile -j"$(nproc)" \
            || make package/feeds/optimwrt/ac-client/compile -j1 V=s
          make package/feeds/optimwrt/aether-sensord/compile -j"$(nproc)" \
            || make package/feeds/optimwrt/aether-sensord/compile -j1 V=s

      - name: Collect packages
        run: |
          set -euo pipefail
          mkdir -p out/${{ matrix.arch }}
          find sdk/bin/packages -name '*.apk' \
            \( -name 'ac-client*' -o -name 'aether-sensord*' -o -name 'aether-appdb*' -o -name 'aether-sigtool*' \) \
            -exec cp -v {} out/${{ matrix.arch }}/ \;
          # An empty directory here means a green build that shipped nothing.
          [ -n "$(ls -A out/${{ matrix.arch }})" ] || { echo "::error::no .apk produced"; exit 1; }
          ls -lh out/${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-${{ strategy.job-index }}
          path: out/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/pkg-')
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: staging }

      - name: Flatten and de-duplicate
        run: |
          set -euo pipefail
          mkdir -p dist
          # Two targets share aarch64_cortex-a53; identical packages, keep one.
          find staging -name '*.apk' | while read -r f; do
            arch="$(basename "$(dirname "$f")")"
            cp -n "$f" "dist/${arch}__$(basename "$f")"
          done
          ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Prebuilt packages for **OpenWrt ${{ env.OPENWRT_RELEASE }}** (apk format).

            Assets are named `<arch>__<package>.apk`. Pick the one matching
            `. /etc/openwrt_release; echo $DISTRIB_ARCH` on your router.

            ```sh
            # on the router
            wget -O /tmp/ac-client.apk <asset-url>
            apk add --allow-untrusted /tmp/ac-client.apk
            ```

            `ac-client` is ~8 MB installed and will not fit a 16 MB-flash device.
            These are ABI-bound to ${{ env.OPENWRT_RELEASE }} and will not install
            on 24.10.
